name: Lint

on:
  # Run on PRs (this covers feature branches)
  pull_request:
    branches: ['**']
  # Run on push only for main/staging branches
  push:
    branches:
      - main
      - staging

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1

      - name: Install dependencies
        run: vp install

      - name: Run Vite+ check (Oxlint + Oxfmt)
        run: vp check

      - name: Run markdown lint
        run: vp run lint:md
